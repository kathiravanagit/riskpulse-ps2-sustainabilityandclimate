services:
  - type: web
    name: riskpulse-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: riskpulse
      - key: PYTHON_VERSION
        value: 3.11.0
